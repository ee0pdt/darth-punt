<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DARTH PUNT</title>
<meta name="description" content="DARTH PUNT — cinematic generative sequencer in the browser.">
<meta name="theme-color" content="#05080d">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap">
<style>
/* ==========================================================================
   Tokens
   ========================================================================== */
:root {
  color-scheme: dark;
  --bg: #05080d;
  --panel: rgba(16, 27, 38, 0.72);
  --panel-solid: #0c151f;
  --raise: rgba(255, 255, 255, 0.045);
  --raise-2: rgba(255, 255, 255, 0.08);
  --hair: rgba(150, 205, 235, 0.09);
  --hair-2: rgba(150, 205, 235, 0.16);
  --text: #dcedf5;
  --muted: rgba(220, 237, 245, 0.62);
  --faint: rgba(220, 237, 245, 0.38);
  --cyan: #5cd3ff;
  --violet: #b07bff;
  --warn: #ff8a3d;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --gutter: 16px;

  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Share Tech Mono", ui-monospace, monospace;
  --font-display: "Orbitron", var(--font-ui);

  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --cell-h: clamp(30px, 6vh, 58px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button, label, .slider, .step { -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html { background: var(--bg); }
body {
  min-height: 100dvh;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(92, 211, 255, 0.10), transparent 60%),
    radial-gradient(900px 600px at 110% 10%, rgba(176, 123, 255, 0.08), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  overflow-x: hidden;
}

:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ==========================================================================
   App shell — wide: stage + sidebar, medium: single column
   ========================================================================== */
.app {
  width: min(1480px, 100%);
  margin: 0 auto;
  padding: 18px max(var(--gutter), env(safe-area-inset-right)) 28px max(var(--gutter), env(safe-area-inset-left));
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "head" "stage" "side";
}
.topbar { grid-area: head; }
.stage { grid-area: stage; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.controls-panel { grid-area: side; min-width: 0; }

@media (min-width: 1100px) and (min-height: 521px) {
  .app { grid-template-columns: minmax(0, 1fr) 340px; grid-template-areas: "head head" "stage side"; align-items: start; }
  .controls-panel {
    position: sticky; top: 16px;
    max-height: calc(100dvh - 32px);
    overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: var(--hair-2) transparent;
  }
  #panels { grid-template-columns: 1fr !important; }
}

/* ==========================================================================
   Top bar: brand · transport · readouts
   ========================================================================== */
.topbar { display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand img { width: 36px; height: 36px; border-radius: 10px; box-shadow: 0 0 24px rgba(92, 211, 255, 0.25); }
.brand h1 {
  font-family: var(--font-display); font-weight: 900;
  font-size: clamp(1.1rem, 2.4vw, 1.6rem); letter-spacing: 0.22em; line-height: 1;
  color: var(--cyan); text-shadow: 0 0 18px rgba(92, 211, 255, 0.45);
  white-space: nowrap;
}
.brand p { margin-top: 5px; font-size: 11px; letter-spacing: 0.18em; color: var(--faint); text-transform: uppercase; }

.readouts { display: flex; gap: 6px; }
.readout {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 62px; height: 48px; padding: 0 12px;
  background: var(--raise); border: 1px solid var(--hair); border-radius: var(--r-md);
}
.readout .lbl { font-size: 10px; letter-spacing: 0.16em; color: var(--faint); }
.readout .val { font-family: var(--font-mono); font-size: 18px; color: var(--text); line-height: 1.1; }
body.is-playing .readout .val { color: var(--cyan); }

/* Transport */
.transport { display: flex; align-items: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 48px; padding: 0 20px; border-radius: 999px;
  font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: 0.16em;
  border: 1px solid var(--hair-2); background: var(--raise);
  transition: background 0.15s, border-color 0.15s, box-shadow 0.2s, color 0.15s, transform 0.1s;
  white-space: nowrap; user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn svg { width: 18px; height: 18px; flex: none; }

.btn-play { min-width: 128px; border-color: rgba(92, 211, 255, 0.55); color: var(--cyan); padding-left: 8px; }
.btn-play .ico {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  background: var(--cyan); color: var(--bg);
}
.btn-play .ico svg { width: 14px; height: 14px; }
.btn-play .i-stop { display: none; }
.btn-play.active { background: rgba(92, 211, 255, 0.14); box-shadow: 0 0 24px rgba(92, 211, 255, 0.25); }
.btn-play.active .i-play { display: none; }
.btn-play.active .i-stop { display: block; }
@media (hover: hover) { .btn-play:hover { background: rgba(92, 211, 255, 0.1); } }

.btn-tension {
  flex-direction: column; gap: 1px; min-width: 132px;
  border-color: rgba(255, 138, 61, 0.55); color: var(--warn);
}
.btn-tension .sub { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; font-weight: 400; opacity: 0.85; }
.btn-tension .sub:empty { display: none; }
.btn-tension[aria-disabled="true"] { opacity: 0.45; border-color: var(--hair-2); color: var(--muted); }
body.is-playing .btn-tension:not(.releasing) { animation: tensionPulse 2.4s ease-in-out infinite; }
.btn-tension.releasing { background: var(--warn); color: var(--bg); box-shadow: 0 0 28px rgba(255, 138, 61, 0.45); }
@media (hover: hover) {
  .btn-tension:not([aria-disabled="true"]):not(.releasing):hover { background: rgba(255, 138, 61, 0.1); }
}
@keyframes tensionPulse {
  0%, 100% { box-shadow: 0 0 0 rgba(255, 138, 61, 0); }
  50% { box-shadow: 0 0 22px rgba(255, 138, 61, 0.35); }
}

.btn-sound { display: none; color: var(--text); }

/* ==========================================================================
   Visualiser
   ========================================================================== */
.viz-wrap {
  position: relative; height: 96px; overflow: hidden;
  border-radius: var(--r-lg); border: 1px solid var(--hair);
  background: linear-gradient(180deg, rgba(92, 211, 255, 0.03), rgba(176, 123, 255, 0.05)), var(--panel);
}
canvas#viz { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.viz-overlay {
  position: absolute; inset: 0; padding: 10px 14px;
  display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
}
.status {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 3px 9px 3px 8px; border-radius: 999px; background: rgba(5, 8, 13, 0.6);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; color: var(--faint);
}
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
body.is-playing .status { color: var(--cyan); }
body.is-playing .status::before { box-shadow: 0 0 8px var(--cyan); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
.event-log {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; color: var(--text);
  padding: 4px 10px; border-radius: 999px; background: rgba(5, 8, 13, 0.6); border: 1px solid var(--hair-2);
  opacity: 0; transform: translateY(-4px); transition: opacity 0.25s, transform 0.25s var(--ease);
}
.event-log.show { opacity: 1; transform: none; }
.viz-hint {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.22em; color: var(--faint);
  transition: opacity 0.3s;
}
body.is-playing .viz-hint { opacity: 0; }
.chord-flash { position: absolute; inset: 0; background: rgba(92, 211, 255, 0.22); opacity: 0; pointer-events: none; }
.chord-flash.active { opacity: 1; transition: none; }
.chord-flash.fade { opacity: 0; transition: opacity 0.6s ease; }

/* ==========================================================================
   Grid card + toolbar
   ========================================================================== */
.grid-card {
  background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r-lg);
  padding: 12px; display: flex; flex-direction: column; gap: 12px;
}
.grid-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grid-toolbar .spacer { flex: 1; }

.segmented {
  display: flex; padding: 3px; gap: 2px;
  background: rgba(0, 0, 0, 0.25); border: 1px solid var(--hair); border-radius: 999px;
}
.segmented button {
  height: 36px; padding: 0 14px; border-radius: 999px;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; color: var(--muted);
  transition: background 0.15s, color 0.15s;
}
.segmented button[aria-pressed="true"] { background: var(--raise-2); color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(92, 211, 255, 0.35); }
@media (hover: hover) { .segmented button:hover { color: var(--text); } }

.icon-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; color: var(--muted);
  border: 1px solid var(--hair-2);
}
.icon-btn svg { width: 14px; height: 14px; }
@media (hover: hover) { .icon-btn:hover { color: var(--warn); border-color: rgba(255, 138, 61, 0.5); } }

.pages { display: none; }

/* Sequencer */
.sequencer { display: flex; flex-direction: column; gap: 6px; touch-action: none; user-select: none; -webkit-user-select: none; }
.track { display: flex; align-items: stretch; gap: 10px; }
.track[data-kind="kick"]  { --c: #ff7a45; }
.track[data-kind="snare"] { --c: #ffb347; }
.track[data-kind="hihat"] { --c: #ffe08a; }
.track[data-kind="bass"]  { --c: #ff5f8f; }
.track[data-kind="lead"]  { --c: #5cd3ff; }
.track[data-kind="arp"]   { --c: #6ef0d0; }
.track[data-kind="pad"]   { --c: #b07bff; }

.track-chip {
  flex: none; width: 76px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
  border-radius: var(--r-sm); background: var(--raise);
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; color: var(--text);
  transition: background 0.15s, color 0.15s;
}
.track-chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; transition: all 0.15s; }
@media (hover: hover) { .track-chip:hover { background: var(--raise-2); } }
.track.muted .track-chip { color: var(--faint); }
.track.muted .track-chip .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
.track.muted .track-chip .name { text-decoration: line-through; text-decoration-color: var(--faint); }

.steps { flex: 1; display: flex; gap: 8px; min-width: 0; }
.beat { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; min-width: 0; }
.step {
  height: var(--cell-h); min-width: 0; border-radius: 7px;
  background: var(--raise); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
  transition: background 0.12s, box-shadow 0.12s, transform 0.08s;
}
.beat > .step:where(:first-child) { background: rgba(255, 255, 255, 0.07); }
@media (hover: hover) { .step:hover { box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 60%, transparent); } }
.step.on {
  background: color-mix(in oklab, var(--c) 72%, #0b1420);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 0 12px color-mix(in oklab, var(--c) 30%, transparent);
}
.step.active { background: rgba(255, 255, 255, 0.13); }
.step.on.active {
  background: color-mix(in oklab, var(--c) 85%, white);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6), 0 0 22px var(--c);
  transform: scale(1.05);
  transition: none;
}
.track.muted .step { opacity: 0.32; }
.step:focus-visible { outline-offset: 1px; position: relative; z-index: 1; }

/* ==========================================================================
   Sound panels
   ========================================================================== */
.sheet-head { display: none; }
#panels { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.card {
  background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r-lg);
  padding: 14px 16px 6px;
}
.card h2 {
  display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
  font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--muted);
}
.card h2::before { content: ""; width: 14px; height: 2px; border-radius: 2px; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

.param { padding: 8px 0 2px; }
.param + .param, .switch-row + .param, .param + .switch-row { border-top: 1px solid var(--hair); }
.param-head { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.param-name { font-size: 14px; color: var(--text); margin-right: auto; }
.param-val { font-family: var(--font-mono); font-size: 14px; color: var(--cyan); min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
.param.is-off .param-val, .param.is-off .param-name { color: var(--faint); }
.param.is-off .slider { opacity: 0.4; }

/* Slider */
.slider {
  --f: 0; --live: 0;
  position: relative; height: 40px; display: flex; align-items: center;
  cursor: pointer; touch-action: pan-y; outline: none;
  padding: 0 11px; /* keep the thumb inside the card at the extremes */
}
.slider-track { position: relative; flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.09); }
.slider-fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--f) * 100%); border-radius: 3px;
  background: linear-gradient(90deg, rgba(92, 211, 255, 0.35), var(--cyan));
}
.slider-thumb {
  position: absolute; top: 50%; left: calc(var(--f) * 100%);
  width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
  background: #e8f7ff; box-shadow: 0 0 0 4px rgba(92, 211, 255, 0.22), 0 2px 8px rgba(0, 0, 0, 0.5);
  transition: box-shadow 0.15s, transform 0.15s;
}
.slider.dragging .slider-thumb { transform: scale(1.12); box-shadow: 0 0 0 7px rgba(92, 211, 255, 0.25), 0 0 18px rgba(92, 211, 255, 0.5); }
.slider:focus-visible .slider-thumb { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--cyan); }
.slider-live {
  position: absolute; top: 50%; left: calc(var(--live) * 100%);
  width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
  border: 2px solid var(--violet); background: var(--bg); box-shadow: 0 0 10px var(--violet);
  transition: left 0.6s var(--ease); pointer-events: none;
}
.param.is-auto .param-val::before { content: "● "; color: var(--violet); font-size: 9px; vertical-align: 2px; }

/* Pill toggle (automation / layer on-off) */
.pill {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--hair-2);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint);
  cursor: pointer; user-select: none; transition: all 0.15s;
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; }
.pill::after { content: ""; position: absolute; inset: -9px -4px; } /* 44px touch target */
.pill input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.pill:has(input:checked) { color: var(--violet); border-color: rgba(176, 123, 255, 0.5); background: rgba(176, 123, 255, 0.12); }
.pill:has(input:checked)::before { opacity: 1; box-shadow: 0 0 6px currentColor; }
.pill:has(input:focus-visible) { outline: 2px solid var(--cyan); outline-offset: 2px; }
.pill-lg { height: 36px; padding: 0 14px; font-size: 12px; }
.pill-lg::after { inset: -4px; }

/* Standalone switch row */
.switch-row {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0;
  cursor: pointer;
}
.switch-row input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch-row .flag-text { flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.switch-hint { font-size: 12px; color: var(--faint); }
.switch-row::after {
  content: ""; flex: none; width: 42px; height: 24px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.1); transition: background 0.15s;
}
.switch-row::before {
  content: ""; position: absolute; right: 21px; top: 50%; width: 18px; height: 18px; margin-top: -9px;
  border-radius: 50%; background: #9fb3bf; transition: transform 0.18s var(--ease), background 0.15s; z-index: 0;
}
.switch-row:has(input:checked)::after { background: rgba(176, 123, 255, 0.55); }
.switch-row:has(input:checked)::before { transform: translateX(18px); background: #fff; }
.switch-row:has(input:focus-visible) { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: var(--r-sm); }

/* ==========================================================================
   Tension overlay
   ========================================================================== */
.tension-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 60; opacity: 0; transition: opacity 1s ease;
  background: radial-gradient(ellipse at center, transparent 35%, rgba(255, 138, 61, 0.16) 100%);
}
.tension-overlay.active { opacity: 1; }

.sheet-backdrop { display: none; }

/* ==========================================================================
   Compact: phones (portrait < 700px wide, or any short landscape screen).
   App fills the viewport, the grid stretches to fit, controls live in a sheet.
   ========================================================================== */
@media (max-width: 699px), (max-height: 520px) {
  :root { --gutter: 12px; }
  html, body { height: 100%; overflow: hidden; }
  .app {
    height: 100dvh; padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: 10px;
    grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "head" "stage"; gap: 10px;
  }
  .brand img { width: 28px; height: 28px; border-radius: 8px; }
  .brand p { display: none; }
  .readout { min-width: 50px; height: 40px; padding: 0 8px; }
  .readout .val { font-size: 15px; }
  .stage { min-height: 0; gap: 10px; }
  .viz-wrap { height: 56px; flex: none; border-radius: var(--r-md); }
  .grid-card { flex: 1; min-height: 0; padding: 10px; gap: 10px; }
  .sequencer { flex: 1; min-height: 0; }
  .track { flex: 1; min-height: 0; gap: 6px; }
  .step { height: 100%; min-height: 26px; }
  .track-chip { width: 56px; padding: 0 7px; gap: 6px; font-size: 11px; letter-spacing: 0.04em; }
  .btn-sound { display: inline-flex; }

  /* Sheet */
  .controls-panel {
    position: fixed; z-index: 80; left: 0; right: 0; bottom: 0;
    max-height: 86dvh; display: flex; flex-direction: column;
    background: var(--panel-solid); border-top: 1px solid var(--hair-2);
    border-radius: 22px 22px 0 0; box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6);
    transform: translateY(calc(100% + 24px)); visibility: hidden;
    transition: transform 0.32s var(--ease), visibility 0s 0.32s;
  }
  .controls-panel.open {
    transform: translateY(var(--drag, 0px)); visibility: visible;
    transition: transform 0.32s var(--ease);
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between; flex: none;
    padding: 18px 16px 10px; position: relative; touch-action: none; cursor: grab;
  }
  .sheet-head::before {
    content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; margin-left: -20px;
    border-radius: 2px; background: var(--hair-2);
  }
  .sheet-head h2 { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.24em; color: var(--muted); }
  .sheet-close {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--raise-2); color: var(--muted);
  }
  .sheet-close svg { width: 16px; height: 16px; }
  #panels {
    overflow-y: auto; overscroll-behavior: contain; padding: 0 12px calc(16px + env(safe-area-inset-bottom));
    gap: 10px;
  }
  .card { background: rgba(255, 255, 255, 0.03); }
  .sheet-backdrop {
    display: block; position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, 0.55);
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
}

/* Portrait phones: transport becomes a bottom dock in the thumb zone */
@media (max-width: 699px) and (min-height: 521px) {
  .app { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .topbar { flex-wrap: nowrap; gap: 10px; }
  .brand h1 { font-size: 1rem; letter-spacing: 0.16em; }
  .transport {
    position: fixed; z-index: 50; left: 0; right: 0; bottom: 0;
    padding: 12px max(12px, env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(5, 8, 13, 0), rgba(5, 8, 13, 0.92) 30%);
    gap: 8px;
  }
  .transport .btn { height: 56px; flex: 1; min-width: 0; padding: 0 12px; }
  .btn-play { flex: 1.3 !important; padding-left: 10px !important; }
  .btn-sound { flex: 0 0 auto !important; width: 64px; padding: 0 !important; flex-direction: column; gap: 2px; font-size: 9px; letter-spacing: 0.12em; }
}

/* Very narrow: hide CHORD readout label crowding, compress grid toolbar */
@media (max-width: 420px) {
  .brand h1 { display: none; }
  .segmented button { padding: 0 10px; font-size: 11px; letter-spacing: 0.06em; height: 34px; }
  .segmented { flex: 1; justify-content: space-between; }
}

/* Narrow: show one page of 8 steps at a time so cells stay finger-sized */
@media (max-width: 559px) {
  .pages { display: flex; }
  .pages button { position: relative; }
  .pages button.playing::after {
    content: ""; position: absolute; top: 5px; right: 6px; width: 5px; height: 5px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 6px var(--cyan);
  }
  .sequencer[data-page="0"] .beat[data-page="1"],
  .sequencer[data-page="1"] .beat[data-page="0"] { display: none; }
  .steps { gap: 6px; }
}

/* Short landscape phones: one-row header with transport, no visualiser, side sheet */
@media (max-height: 520px) {
  .app { gap: 8px; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .topbar { flex-wrap: nowrap; gap: 10px; }
  .brand h1 { font-size: 0.95rem; letter-spacing: 0.16em; }
  .viz-wrap { display: none; }
  .btn { height: 40px; padding: 0 14px; font-size: 11px; }
  .btn-play { min-width: 104px; padding-left: 5px; }
  .btn-play .ico { width: 30px; height: 30px; }
  .btn-tension { min-width: 104px; }
  .readout { height: 40px; }
  .grid-card { padding: 8px; gap: 8px; }
  .grid-toolbar { flex-wrap: nowrap; }
  .segmented button, .icon-btn, .pill-lg { height: 32px; }
  .sequencer { gap: 4px; }
  .controls-panel {
    left: auto; top: 0; width: min(380px, 88vw); max-height: none;
    border-radius: 22px 0 0 22px; border-top: 0; border-left: 1px solid var(--hair-2);
    transform: translateX(calc(100% + 24px));
  }
  .controls-panel.open { transform: translateX(var(--drag, 0px)); }
  .sheet-head::before { display: none; }
  #panels { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
}
@media (max-height: 520px) and (max-width: 820px) {
  .readout[data-k="bar"], .brand h1 { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="tension-overlay" id="tensionOverlay"></div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <img src="./icons/icon.svg" alt="" width="36" height="36">
      <div>
        <h1>DARTH PUNT</h1>
        <p>Cinematic generative sequencer</p>
      </div>
    </div>

    <div class="transport" role="group" aria-label="Transport">
      <button class="btn btn-play" id="playBtn" aria-pressed="false">
        <span class="ico" aria-hidden="true">
          <svg class="i-play" viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg>
          <svg class="i-stop" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
        </span>
        <span id="playLabel">PLAY</span>
      </button>
      <button class="btn btn-tension" id="tensionBtn" aria-disabled="true" aria-pressed="false"
        title="Build tension for four bars, then drop (while playing)">
        <span>TENSION</span><span class="sub" id="tensionSub" aria-live="polite"></span>
      </button>
      <button class="btn btn-sound" id="soundBtn" aria-controls="controls" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span>SOUND</span>
      </button>
    </div>

    <div class="readouts" aria-live="off">
      <div class="readout" data-k="bar"><span class="lbl">BAR</span><span class="val" id="barVal">—</span></div>
      <div class="readout"><span class="lbl">CHORD</span><span class="val" id="chordVal">—</span></div>
      <div class="readout"><span class="lbl">BPM</span><span class="val" id="bpmReadout">120</span></div>
    </div>
  </header>

  <main class="stage">
    <div class="viz-wrap">
      <canvas id="viz" aria-hidden="true"></canvas>
      <div class="chord-flash" id="chordFlash"></div>
      <div class="viz-hint">PRESS PLAY</div>
      <div class="viz-overlay">
        <div class="status" id="status" role="status">STOPPED</div>
        <div class="event-log" id="eventLog" aria-live="polite"></div>
      </div>
    </div>

    <section class="grid-card" aria-label="Step sequencer">
      <div class="grid-toolbar">
        <div class="segmented" role="group" aria-label="Pattern">
          <button data-pattern="tron" aria-pressed="false">TRON</button>
          <button data-pattern="daft" aria-pressed="false">DAFT</button>
          <button data-pattern="derezzed" aria-pressed="false">DEREZZED</button>
          <button data-pattern="random" aria-pressed="false">RANDOM</button>
        </div>
        <div class="segmented pages" id="pageBtns" role="group" aria-label="Steps shown">
          <button data-page="0" aria-pressed="true">1–8</button>
          <button data-page="1" aria-pressed="false">9–16</button>
        </div>
        <span class="spacer"></span>
        <span id="mutateSlot"></span>
        <button class="icon-btn" id="clearBtn" title="Clear every step">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
          CLEAR
        </button>
      </div>
      <div class="sequencer" id="sequencer"></div>
    </section>
  </main>

  <aside class="controls-panel" id="controls" aria-label="Sound controls">
    <div class="sheet-head" id="sheetGrip">
      <h2>SOUND</h2>
      <button class="sheet-close" id="sheetClose" aria-label="Close sound controls">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
      </button>
    </div>
    <div id="panels"></div>
  </aside>

</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>

<script type="module" src="./dist/main.js"></script>

</body>
</html>
